# UPS 电量与续航估算参数（供 /usr/local/lib/ups-pve/nut_bridge.py 读取）
#
# 电池：2 块 12V 45Ah 串联 = 24V 45Ah，标称 1080Wh。
# 原厂程序只汇报单块 12V 电压，桥接按 2 倍输出整组电压。
#
# 续航参考点（保守标定）：
#   RUNTIME_MINUTES     满电、参考负载下的续航（分钟）
#   REFERENCE_LOAD_PCT  参考负载（ups.load）
#   MIN_LOAD_PCT        负载下限，避免空载除零
#   RATED_WATTS         UPS 额定有功功率，用于把 ups.load 换算成瓦
#
# 电量模型：
#   - 市电时按 CHARGE_HOURS 从当前 SOC 充到 99%，整组达到 FULL_VOLTAGE
#     并稳定后置为 100%
#   - 断电时按 RATED_WATTS × 负载百分比积分耗电，扣减 SOC
#   - 原厂电量只在首次启动、无历史状态时作为初值；它按电压查表且不补偿
#     负载压降，断电瞬间会从 97% 跳到 50%，不能直接使用
#
# 电压校准（仅影响显示）：
#   2026-10-29 21:25 浮充复查：万用表实测整组 26.2V，原厂读数 25.40V，
#   低 0.80V（此前一次实测 26.3V / 25.45V，得出 0.85V，两者差 0.05V）。
#   VOLTAGE_OFFSET 只加到 NUT 的 battery.voltage、网页卡片和曲线；
#   SOC/续航计算、低压降额和 LB 判定仍用原厂原始电压，保持短测验证过的
#   阈值行为不变。原厂电压是按电量查表的档位值（常见 0.1V/块步进），
#   不是实时 ADC，精度预期到 0.1V 即可。
#
# 2026-10-29 短测：断电 31.2 分钟，负载 17–24%，单块 13.5→11.8V 后基本
# 持平；按本模型消耗约 7% 可用电量。31 分钟不足以标定总续航，故参考点
# 保持保守值。标称 1080Wh 对应理论上限，实际可用按 528Wh 估算
# （360min × 22% × 400W），已包含放电深度、逆变效率、老化等余量。

RUNTIME_MINUTES=50
REFERENCE_LOAD_PCT=22
MIN_LOAD_PCT=5
RATED_WATTS=400
CHARGE_HOURS=10
FULL_VOLTAGE=26.7
VOLTAGE_OFFSET=0.80

# 2026-10-29 22:33-23:10 深度放电实测（TL 自检，37 分钟，负载 18%，万用表逐点配对）
#
# 原厂电量表已解出闭式：原厂那行"UPS Battery Level"不是容量，而是按单块
# 电压查表： charge% = round((V_block - 10.0) * 10) / 36，即每 0.1V/块跳
# 2.7778%，整组满量程被压在 20.0-27.2V。原厂电压确实是实测 ADC，但只有
# 0.1V/块步进且带 +-1 格抖动（1s 日志按分钟取平均可解到 0.02V）。
# 实测对照：raw+0.80 在浮充和带载放电两种状态下都与万用表吻合（0.06V 内）。
#
# 带载 18%（约 105-126W DC，整组约 5.2A）时的真实曲线：
#   t+0.8min  实测24.8V  raw24.06  原厂表55.6%  安时SOC 99.9%
#   t+4.3min  实测24.5V  raw23.67  原厂表50.0%  安时SOC 99.2%
#   t+11.3min 实测24.4V  raw23.60  原厂表50.0%  安时SOC 97.9%
#   t+18.3min 实测24.3V  raw23.60  原厂表50.0%  安时SOC 96.5%
#   t+25.3min 实测24.3V  raw23.60  原厂表50.0%  安时SOC 95.3%
#   t+30.5min 实测24.2V  raw(失联) 原厂表50.0%  安时SOC 93.0%
# 原厂 raw 从第 8 到第 30 分钟一动不动锁在 23.600 —— 0.1V 步进约等于 5 分钟
# 真实压降，带载平台又极平（实测 1% SOC 只有 0.05V），所以原厂电量表和整组电压
# 都无法用来估 SOC，只能当兜底；SOC 必须由安时/能量积分给出（桥接已是如此）。
#
# 阈值改到实测平台之下（原厂 raw 域，实测=raw+0.80）：
#   VOLTAGE_DERATE_START 23.2 -> 22.6（实测 23.4）：旧值距实测平台 23.6 只有
#   0.4V，一断电就会立刻开始降额；现在留 1.0V，约对应最后三分之一容量。
#   LB_VOLTAGE 21.6 raw = 实测 22.4 = 1.87V/格，按本次斜率还剩约 20%，保留。
#   VOLTAGE_CUTOFF 21.0 raw（=实测 21.8，约 1.8V/格）作为续航外推的零点，保留。
#   续航参考点 RUNTIME_MINUTES=50 不动：本次实测耗电斜率 0.196%/min，
#   模型给出 0.227%/min，即模型比实测保守约 16%；在 PF/逆变效率未实测、
#   且只放到 7% 深度的情况下，这个余量应当保留，不要往上调。
#   NUT 侧新增 battery.charge.vendor，只用于对照，不参与任何计算。
#   注：RATED_WATTS 在runtime = 可用能量/功率 的换算里会被约掉（可用能量本身就是
#   由它标定出来的），改它不影响 SOC 与续航，故保持 400 不动。
#
VOLTAGE_DERATE_START=22.6
VOLTAGE_CUTOFF=21.0
LB_VOLTAGE=22.0
LB_SOC=20

# 2026-10-30 实测重标定（01:22-02:25 满程放电 + 04:11 短测）：
#   从当前可达的充满状态 24.6 V raw（原厂表 63.9%）放到 21.6 V，历时 63m53s，
#   负载 18%（约 72 W），实际输出约 72 × 1.065 ≈ 77 Wh。
#   折算到参考负载 22%（88 W）满程约 52 min，取 50 min 留 4% 余量：
#   usable = 50/60 × 22% × 400 W ≈ 73 Wh；18% 负载下模型给约 60 min，
#   与实测 64 min 基本吻合。
#   RUNTIME_MINUTES=360（528 Wh）是按 45 Ah 标称值推的，这组电池实测达不到，
#   先按实测值走；外接充电器真正充满并复测到更长续航后再上调。
#   LB_VOLTAGE 21.6 -> 22.0：UPS 自身 0x40 低电位实测在 21.8 V 触发并蜂鸣，
#   软件提前 0.2 V 发 FSD，避免先响蜂鸣再关机。
#   VOLTAGE_CUTOFF 维持 21.0：逆变器硬切断推断在 20.0-21.0 V（未实测），取上限更保守。
#   充电特性未改：CHARGE_HOURS/FULL_VOLTAGE 仍假设正常充电；内置充电器实际是涓流，
#   要充满必须外接 24 V 充电器。
