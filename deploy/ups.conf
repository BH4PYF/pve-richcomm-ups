# NUT device definition (PVE host)
# Fed by /usr/local/lib/ups-pve/nut_bridge.py, which mirrors the readings of
# the vendor Richcomm Power Manager program into /run/ups-bridge/ups.dev.
[ups]
    driver = dummy-ups
    port = /run/ups-bridge/ups.dev
    desc = "Richcomm UPS (vendor Power Manager bridge)"
    mode = dummy-once
